name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build VRPC.sln --nologo -v minimal

      - name: Test
        run: dotnet test VRPC.sln --nologo --no-build
